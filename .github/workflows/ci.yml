name: CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm exec tsc --noEmit

      - name: Master Production Quality Gate
        if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
        run: |
          echo "1. Controle op 0 ESLint warnings..."
          pnpm run lint --max-warnings=0

          echo "2. Controle op verboden select('*') database queries..."
          if git grep -n -E "\.select\(\s*['\"]\*['\"]\s*\)" -- "app/" "components/" "lib/" "types/"; then
            echo "::error::Verboden select('*') gevonden. Specificeer altijd expliciete kolommen."
            exit 1
          fi

          echo "3. Controle op achtergebleven console.log() statements..."
          if git grep -n "console\.log(" -- "app/" "components/" "lib/" "types/"; then
            echo "::error::console.log() gevonden op master. Verwijder debug logs voor productie."
            exit 1
          fi

          echo "4. Controle op achtergebleven code-comments (// of {/* */})..."
          if git grep -n -P "(^|[^:])//|\{/\*" -- "app/" "components/" "lib/" "types/"; then
            echo "::error::Code-comments gevonden op master. Verwijder comments voor merge naar master."
            exit 1
          fi

      - name: Build Next.js application
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run build
